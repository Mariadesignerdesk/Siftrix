# Alembic configuration for Siftrix backend database migrations.

[alembic]
# Path to migration scripts (relative to alembic.ini location)
script_location = %(here)s/alembic

# Revision file naming convention: e.g. 0001_initial_schema_and_users.py
file_template = %%(rev)s_%%(slug)s

# Prepend backend directory to sys.path so 'app' package is importable
prepend_sys_path = %(here)s

# Version locations
version_locations = %(here)s/alembic/versions
path_separator = os

# Default fallback database URL; dynamically overridden in env.py from app.core.config.settings
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/siftrix

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
